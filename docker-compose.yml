version: '3.9'

volumes:
  postgres_data:
  redis_data:

services:
  django:
    build: .
    image: product_search_django
    container_name: product_search_django
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

    env_file:
      - ./.env
    ports:
      - '8000:8000'
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  postgres:
    image: postgres:16
    container_name: product_search_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.env
    ports:
      - '5432:5432'


  redis:
    image: docker.io/redis:6
    container_name: product_search_redis

    volumes:
      - redis_data:/data